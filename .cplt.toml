# Detected: JVM (Maven), Docker, Flyway

[propose]
# ⚠️  grants access to Docker socket — effectively root on the host
# Suggested by: (root)
allow_docker = true
# Suggested by: (root)
allow_jvm_attach = true

[propose.allow]
ports = [5432, 5442, 5443, 8082]
socket = ["/var/run/docker.sock"]

