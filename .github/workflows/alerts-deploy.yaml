name: Deploy alerts

on:
  push:
    branches:
      - main
    paths:
      - '.nais/alerts/**'
      - '.github/workflows/alerts-deploy.yaml'

permissions:
  id-token: write

jobs:
  dev-deploy:
    name: Deploy alerts to dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy to dev
        uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/alerts/alerts.yaml
          VARS: .nais/alerts/vars-preprod.yaml

  prod-deploy:
    name: Deploy alerts to prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy to prod
        uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # v3
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/alerts/alerts.yaml
          VARS: .nais/alerts/vars-prod.yaml
