name: Rebuild and deploy to prod
run-name: Rebuild and deploy to prod [${{ github.ref_name }}]
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
      timezone: Europe/Oslo
concurrency:
  group: forms-api-deploy-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-and-deploy.yaml
    permissions:
      contents: read
      id-token: write
    secrets:
      NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
