name: Build and test
on:
  push:
    paths-ignore:
      - '**.md'
      - '**/**.md'
      - '.nais/alerts/**'
      - '.github/workflows/alerts-deploy.yaml'
permissions:
  contents: read

jobs:
  build-and-deploy:
    uses: ./.github/workflows/build-and-deploy.yaml
    permissions:
      contents: read
      id-token: write
    secrets:
      NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
