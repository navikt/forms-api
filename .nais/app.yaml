apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: forms-api
  namespace: fyllut-sendinn
spec:
  ingresses:
  {{#each ingresses}}
    - "{{this}}"
  {{/each}}
  image: {{ image }}
  port: 8082
  replicas:
    max: 4
    min: 2
  resources:
    limits:
      memory: 4096Mi
    requests:
      memory: 2048Mi
  startup:
    path: /internal/health/isReady
    initialDelay: 0
    periodSeconds: 5
    failureThreshold: 36
    timeout: 2
  liveness:
    path: /internal/health/isAlive
    initialDelay: 0
    periodSeconds: 10
    failureThreshold: 3
    timeout: 2
  readiness:
    path: /internal/health/isReady
    initialDelay: 0
    periodSeconds: 5
    timeout: 2
  prometheus:
    enabled: true
    path: /actuator/prometheus
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
  azure:
    application:
      enabled: true
      allowAllUsers: true
      claims:
        groups:
        {{#each azure.ad_groups}}
          - id: "{{this.id}}"
        {{/each}}
        extra:
          - NAVident
    sidecar:
      enabled: true
  accessPolicy:
    inbound:
      rules:
      {{#each accessPolicy.inbound.rules}}
        - application: "{{this.application}}"
          namespace: "{{this.namespace}}"
      {{/each}}
  gcp:
    sqlInstances:
      - type: POSTGRES_18
        tier: {{ database.tier }}
        diskType: SSD
        highAvailability: true
        diskAutoresize: true
        databases:
          - name: {{ database.name }}
    buckets:
      - name: "{{ buckets.static-pdfs.name }}"
  env:
    - name: JDK_JAVA_OPTIONS
      value: "-Xms1g -XX:MaxRAMPercentage=80"
    - name: SPRING_PROFILES_ACTIVE
      value: {{ spring-profiles-active }}
    - name: STATIC_PDFS_BUCKET_NAME
      value: "{{ buckets.static-pdfs.name }}"
    {{#each azure.ad_groups}}
    - name: "FORMS_API_AD_GROUP_{{this.type}}"
      value: "{{this.id}}"
    {{/each}}
