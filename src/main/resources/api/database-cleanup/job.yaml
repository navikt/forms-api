get:
  operationId: getDatabaseCleanupJob
  tags: [database-cleanup]
  summary: Get job progress and per-form outcomes
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: jobId
      required: true
      schema:
        $ref: "../common/components.yaml#/components/schemas/UUID"
  responses:
    '200':
      description: Job status
      content:
        application/json:
          schema:
            $ref: "./components.yaml#/components/schemas/DatabaseCleanupJob"
    '403':
      description: Production environment or unauthorized admin
    '404':
      description: Unknown job
      content:
        application/json:
          schema:
            $ref: "../common/components.yaml#/components/schemas/ErrorResponseDto"
