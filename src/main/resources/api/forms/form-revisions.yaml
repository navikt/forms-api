get:
  summary: Henter revisoner for et skjema
  operationId: getFormRevisions
  description: Henter alle revisoner for et skjema.
  security: []
  parameters:
    - name: formPath
      in: path
      description: Skjemaets path
      required: true
      schema:
        $ref: "./components.yaml#/components/schemas/FormPath"
  responses:
    200:
      description: Returnerer en liste med alle revisioner for skjemaet
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "./components.yaml#/components/schemas/FormRevisionDto"
    404:
      description: Finner ikke skjema med gitt id
      content:
        application/json:
          schema:
            $ref: "../common/components.yaml#/components/schemas/ErrorResponseDto"
  tags:
    - edit-forms
