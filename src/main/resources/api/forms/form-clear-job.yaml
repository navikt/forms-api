get:
  operationId: getFormClearJob
  tags: [form-clear]
  summary: Get job progress and per-form outcomes
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: jobId
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Job status
      content:
        application/json:
          schema:
            $ref: "./form-clear-components.yaml#/components/schemas/FormClearJob"
    '403':
      description: Production environment or unauthorized admin
    '404':
      description: Unknown job
